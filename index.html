<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mombasa Ride — Client App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      position: relative;
      z-index: 500;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
    }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    .dot.connected {
      background: var(--green);
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    .booking-sheet {
      position: relative;
      z-index: 500;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      padding: 12px 14px 16px;
      max-height: 60dvh;
      overflow-y: auto;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
    }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #475569;
      margin: 0 auto 10px;
    }

    .gps-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .fleet-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }

    .fleet-btn.active {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.14);
    }

    .fleet-name {
      font-size: 12px;
      font-weight: 800;
      display: block;
    }

    .fleet-min {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .fare-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .fare-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .fare-total {
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .book-btn {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .book-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #cancel-ride-btn {
      display: none;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    #cancel-ride-btn.visible {
      display: inline-block;
    }

    .status-banner {
      margin-top: 8px;
      font-size: 12px;
      color: var(--amber);
      min-height: 16px;
    }

    .driver-card {
      display: none;
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 10px;
      gap: 10px;
      align-items: center;
    }

    .driver-card.visible {
      display: flex;
    }

    .driver-card img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--green);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Mombasa Ride</div>
    <div class="conn-pill">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">Connecting...</span>
    </div>
  </header>

  <div id="map"></div>

  <section class="booking-sheet">
    <div class="handle"></div>

    <div class="gps-line">
      <span id="gps-status">Locating in Mombasa...</span>
      <button type="button" class="link-btn" onclick="repositionGPS()">Reposition GPS</button>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="rider-name">Your Name</label>
        <input type="text" id="rider-name" value="Guest Rider" />
      </div>
      <div class="field">
        <label for="rider-phone">Phone (Optional)</label>
        <input type="tel" id="rider-phone" placeholder="+2547..." />
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="pickup-select">Pickup Hub</label>
        <select id="pickup-select" onchange="onRouteChange()">
          <option value="current">Current Live GPS</option>
          <option value="airport">Moi International Airport</option>
          <option value="nyali">Nyali Centre</option>
          <option value="sgr">SGR Miritini Station</option>
          <option value="likoni">Likoni Ferry</option>
          <option value="cbd">Mombasa CBD / Mwembe Tayari</option>
          <option value="bamburi">Bamburi Beach</option>
        </select>
      </div>
      <div class="field">
        <label for="dropoff-select">Drop-off Hub</label>
        <select id="dropoff-select" onchange="onRouteChange()">
          <option value="nyali">Nyali Centre</option>
          <option value="airport">Moi International Airport</option>
          <option value="sgr">SGR Miritini Station</option>
          <option value="likoni">Likoni Ferry</option>
          <option value="cbd">Mombasa CBD / Mwembe Tayari</option>
          <option value="bamburi">Bamburi Beach</option>
        </select>
      </div>
    </div>

    <div class="fleet-grid" id="fleet-grid">
      <button type="button" class="fleet-btn" data-class="Boda" onclick="selectFleet('Boda')">
        <span class="fleet-name">Boda</span>
        <span class="fleet-min">Min KES 150</span>
      </button>
      <button type="button" class="fleet-btn" data-class="Tukutuku" onclick="selectFleet('Tukutuku')">
        <span class="fleet-name">Tukutuku</span>
        <span class="fleet-min">Min KES 200</span>
      </button>
      <button type="button" class="fleet-btn active" data-class="Standard Vehicle" onclick="selectFleet('Standard Vehicle')">
        <span class="fleet-name">Standard</span>
        <span class="fleet-min">Min KES 250</span>
      </button>
      <button type="button" class="fleet-btn" data-class="Comfort Class" onclick="selectFleet('Comfort Class')">
        <span class="fleet-name">Comfort</span>
        <span class="fleet-min">Min KES 350</span>
      </button>
      <button type="button" class="fleet-btn" data-class="XL" onclick="selectFleet('XL')">
        <span class="fleet-name">XL</span>
        <span class="fleet-min">Min KES 400</span>
      </button>
      <button type="button" class="fleet-btn" data-class="VIP Class" onclick="selectFleet('VIP Class')">
        <span class="fleet-name">VIP Class</span>
        <span class="fleet-min">NEW</span>
      </button>
    </div>

    <div class="fare-bar">
      <div>
        <div style="font-size:13px;font-weight:700;" id="fare-class-label">Standard Vehicle</div>
        <div class="fare-meta" id="fare-detail-label">Calculating live route...</div>
      </div>
      <div class="fare-total" id="live-fare-display">KES 250</div>
    </div>

    <div class="action-row">
      <button type="button" class="book-btn" id="book-btn" onclick="requestRide()">Request Ride</button>
      <button type="button" id="cancel-ride-btn" onclick="cancelActiveRide()">Cancel</button>
    </div>

    <div class="status-banner" id="booking-status"></div>

    <div class="driver-card" id="matched-driver-card">
      <img id="matched-driver-img" src="" alt="Driver" />
      <div style="font-size:13px;line-height:1.4;">
        <div style="font-weight:800;color:#10b981;" id="matched-driver-name">Driver Matched</div>
        <div id="matched-driver-vehicle"></div>
        <div id="matched-driver-phone" style="color:#94a3b8;"></div>
      </div>
    </div>
  </section>

  <script>
    const SERVER_URL = 'https://mombasa-ride-server.onrender.com';
    const MOMBASA_CENTER = [-4.0435, 39.6682];

    const HUBS = {
      airport: { label: 'Moi International Airport', lat: -4.0348, lng: 39.5942 },
      nyali: { label: 'Nyali Centre', lat: -4.0197, lng: 39.6876 },
      sgr: { label: 'SGR Miritini Station', lat: -3.9912, lng: 39.5895 },
      likoni: { label: 'Likoni Ferry', lat: -4.0844, lng: 39.6606 },
      cbd: { label: 'Mombasa CBD / Mwembe Tayari', lat: -4.0547, lng: 39.6636 },
      bamburi: { label: 'Bamburi Beach', lat: -3.9826, lng: 39.7285 }
    };

    const FLEET_CONFIG = {
      'Boda': { minFare: 150, base: 60, perKm: 25, isNew: false },
      'Tukutuku': { minFare: 200, base: 80, perKm: 32, isNew: false },
      'Standard Vehicle': { minFare: 250, base: 110, perKm: 45, isNew: false },
      'Comfort Class': { minFare: 350, base: 150, perKm: 58, isNew: false },
      'XL': { minFare: 400, base: 180, perKm: 70, isNew: false },
      'VIP Class': { minFare: null, base: null, perKm: null, isNew: true }
    };

    const SURGE_ZONES = [
      { name: 'Nyali Bridge', lat: -4.0325, lng: 39.6775, mult: 1.4 },
      { name: 'MBA Airport', lat: -4.0348, lng: 39.5942, mult: 1.3 },
      { name: 'SGR Miritini', lat: -3.9912, lng: 39.5895, mult: 1.5 },
      { name: 'Likoni Ferry', lat: -4.0844, lng: 39.6606, mult: 1.2 }
    ];

    let selectedClass = 'Standard Vehicle';
    let liveCoords = { lat: MOMBASA_CENTER[0], lng: MOMBASA_CENTER[1] };
    let calculatedFareNum = 250;
    let calculatedDistanceKm = 1.0;
    let activeRideId = null;

    const map = L.map('map', { zoomControl: true }).setView(MOMBASA_CENTER, 13);

    const wikimediaTiles = L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', {
      attribution: '&copy; Wikimedia maps &copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    const brightTiles = L.tileLayer('https://a.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap France &copy; OpenStreetMap contributors',
      maxZoom: 20
    });

    brightTiles.on('tileerror', () => {
      if (!map.hasLayer(wikimediaTiles)) {
        map.addLayer(wikimediaTiles);
      }
    });

    brightTiles.addTo(map);

    const pickupMarker = L.circleMarker(MOMBASA_CENTER, {
      radius: 9,
      color: '#ffffff',
      weight: 3,
      fillColor: '#3b82f6',
      fillOpacity: 1
    }).addTo(map);

    function haversineKm(lat1, lon1, lat2, lon2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getPickupCoordAndLabel() {
      const key = document.getElementById('pickup-select').value;
      if (key === 'current') {
        return { lat: liveCoords.lat, lng: liveCoords.lng, label: 'Current Mombasa Location' };
      }
      return HUBS[key];
    }

    function getDropoffCoordAndLabel() {
      const key = document.getElementById('dropoff-select').value;
      return HUBS[key];
    }

    function getSurgeMultiplier(lat, lng) {
      let best = { mult: 1.0, zone: null };
      for (const z of SURGE_ZONES) {
        const d = haversineKm(lat, lng, z.lat, z.lng);
        if (d <= 2.2 && z.mult > best.mult) {
          best = { mult: z.mult, zone: z.name };
        }
      }
      return best;
    }

    function recalculateLiveFare() {
      const p = getPickupCoordAndLabel();
      const d = getDropoffCoordAndLabel();
      const cfg = FLEET_CONFIG[selectedClass] || FLEET_CONFIG['Standard Vehicle'];

      const straightKm = haversineKm(p.lat, p.lng, d.lat, d.lng);
      const roadKm = Math.max(1.0, Number((straightKm * 1.3).toFixed(1)));
      calculatedDistanceKm = roadKm;

      const surge = getSurgeMultiplier(p.lat, p.lng);
      document.getElementById('fare-class-label').textContent = selectedClass;

      if (cfg.isNew) {
        calculatedFareNum = 0;
        document.getElementById('live-fare-display').textContent = 'NEW';
        document.getElementById('fare-detail-label').textContent =
          `~${roadKm} km • VIP pricing coming soon`;
        return;
      }

      const rawFare = cfg.base + roadKm * cfg.perKm;
      const withFloor = Math.max(cfg.minFare, rawFare);
      const finalFare = Math.round((withFloor * surge.mult) / 10) * 10;
      calculatedFareNum = finalFare;

      document.getElementById('live-fare-display').textContent = `KES ${finalFare.toLocaleString()}`;
      document.getElementById('fare-detail-label').textContent = surge.zone
        ? `~${roadKm} km • ${surge.zone} ${surge.mult}x surge`
        : `~${roadKm} km • Min KES ${cfg.minFare}`;
    }

    function syncPickupPin(fly = false) {
      const p = getPickupCoordAndLabel();
      pickupMarker.setLatLng([p.lat, p.lng]);
      if (fly) {
        map.flyTo([p.lat, p.lng], 13);
      }
      recalculateLiveFare();
    }

    function onRouteChange() {
      syncPickupPin(true);
    }

    function selectFleet(cls) {
      selectedClass = cls;
      document.querySelectorAll('.fleet-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.class === cls);
      });
      recalculateLiveFare();
    }

    function repositionGPS() {
      if (!navigator.geolocation) {
        document.getElementById('gps-status').textContent = 'GPS unavailable — Mombasa center';
        syncPickupPin(true);
        return;
      }
      document.getElementById('gps-status').textContent = 'Updating live GPS...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          liveCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          document.getElementById('gps-status').textContent =
            `Live GPS: ${liveCoords.lat.toFixed(4)}, ${liveCoords.lng.toFixed(4)}`;
          syncPickupPin(true);
        },
        () => {
          document.getElementById('gps-status').textContent = 'GPS permission denied — Mombasa center';
          syncPickupPin(true);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
      );
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          liveCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          document.getElementById('gps-status').textContent =
            `Live GPS: ${liveCoords.lat.toFixed(4)}, ${liveCoords.lng.toFixed(4)}`;
          if (document.getElementById('pickup-select').value === 'current') {
            syncPickupPin(false);
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
      );
    }

    function setActiveRideUI(rideId, statusText) {
      activeRideId = rideId;
      document.getElementById('book-btn').disabled = true;
      const cancelBtn = document.getElementById('cancel-ride-btn');
      cancelBtn.classList.add('visible');
      cancelBtn.disabled = false;
      document.getElementById('booking-status').textContent = statusText;
    }

    function clearRideUI(statusText = '') {
      activeRideId = null;
      document.getElementById('book-btn').disabled = false;
      const cancelBtn = document.getElementById('cancel-ride-btn');
      cancelBtn.classList.remove('visible');
      cancelBtn.disabled = true;
      document.getElementById('matched-driver-card').classList.remove('visible');
      if (statusText) {
        document.getElementById('booking-status').textContent = statusText;
      }
    }

    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      document.getElementById('conn-dot').classList.add('connected');
      document.getElementById('conn-text').textContent = 'Connected';
    });

    socket.on('disconnect', () => {
      document.getElementById('conn-dot').classList.remove('connected');
      document.getElementById('conn-text').textContent = 'Reconnecting...';
    });

    function requestRide() {
      recalculateLiveFare();
      const p = getPickupCoordAndLabel();
      const d = getDropoffCoordAndLabel();
      const passengerName = (document.getElementById('rider-name').value || 'Guest Rider').trim();
      const passengerPhone = (document.getElementById('rider-phone').value || '').trim();
      const rideId = 'RIDE-' + Math.floor(100000 + Math.random() * 900000);

      const payload = {
        rideId,
        passengerName,
        passengerPhone: passengerPhone || 'Not provided',
        vehicleClass: selectedClass,
        pickup: p.label,
        pickupLat: p.lat,
        pickupLng: p.lng,
        dropoff: d.label,
        distanceKm: calculatedDistanceKm,
        fare: calculatedFareNum > 0 ? calculatedFareNum : 'NEW'
      };

      if (socket.connected) {
        socket.emit('new_ride_request', payload);
        setActiveRideUI(
          rideId,
          `Requesting ${selectedClass} (${payload.fare === 'NEW' ? 'NEW' : 'KES ' + payload.fare})...`
        );
      } else {
        document.getElementById('booking-status').textContent = 'Not connected to dispatch server yet.';
      }
    }

    function cancelActiveRide() {
      if (!activeRideId) {
        clearRideUI('');
        return;
      }
      if (socket.connected) {
        socket.emit('rider_cancel_ride', { rideId: activeRideId });
      }
      clearRideUI('Ride request cancelled.');
    }

    socket.on('ride_accepted', (data) => {
      if (!data) return;
      if (activeRideId && data.rideId && data.rideId !== activeRideId) return;
      document.getElementById('booking-status').textContent = 'Driver accepted your rideconst card = document.getElementById('matched-driver-card');
      card.classList.add('visible');
      if (data.driverPhoto) {
        document.getElementById('matched-driver-img').src = data.driverPhoto;
      }
      document.getElementById('matched-driver-name').textContent =
        `${data.driverName || 'Driver'} • ${data.plate || ''}`;
      document.getElementById('matched-driver-vehicle').textContent =
        `${data.carModel || selectedClass} (${data.carColor || ''})`;
      document.getElementById('matched-driver-phone').textContent = data.driverPhone || '';
    });

    function handleDriverCancellation(data = {}) {
      if (activeRideId && data.rideId && data.rideId !== activeRideId) return;
      clearRideUI(data.reason || 'Driver cancelled the trip. You can request a new ride.');
    }

    socket.on('ride_cancelled_by_driver', handleDriverCancellation);
    socket.on('driver_cancel_ride', handleDriverCancellation);
    socket.on('ride_cancelled', handleDriverCancellation);

    recalculateLiveFare();
  </script>
</body>
</html>
