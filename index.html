<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mombasa Ride - Book Your Ride</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(15, 23, 42, 0.95);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #0f172a;
    }

    .dark-map-tiles {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(92%);
    }

    .top-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .brand-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-title h2 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .brand-title p {
      font-size: 10px;
      color: var(--accent-green);
      font-weight: 600;
    }

    .promo-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .booking-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 14px 16px 22px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      margin: 0 auto 12px;
    }

    .input-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .location-input-box {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .location-input-box span {
      font-size: 14px;
    }

    .location-input-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      width: 100%;
      outline: none;
    }

    .location-input-box input::placeholder {
      color: var(--text-muted);
    }

    .quick-destinations {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .quick-destinations::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .book-btn {
      width: 100%;
      background: var(--accent-green);
      color: #052e16;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .status-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      align-items: flex-end;
      padding: 16px;
    }

    .status-modal.active {
      display: flex;
    }

    .status-card {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .status-card h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--accent-green);
    }

    .status-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .driver-assigned-box {
      background: rgba(15, 23, 42, 0.72);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .driver-assigned-box .plate-line {
      color: var(--accent-amber);
      font-weight: 800;
    }

    .cancel-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-hud">
    <div class="brand-pill">
      <div class="brand-title">
        <h2>Mombasa Ride</h2>
        <p id="conn-label">🟡 Connecting to dispatch...</p>
      </div>
      <div class="promo-badge">0% Commission</div>
    </div>
  </div>

  <div class="booking-sheet">
    <div class="sheet-handle"></div>

    <div class="input-row-2">
      <div class="location-input-box">
        <span>👤</span>
        <input type="text" id="rider-name" placeholder="Your name" />
      </div>
      <div class="location-input-box">
        <span>📞</span>
        <input type="tel" id="rider-phone" placeholder="Phone (+254...)" />
      </div>
    </div>

    <div class="input-group">
      <div class="location-input-box">
        <span>🟢</span>
        <input type="text" id="pickup-input" value="Moi International Airport" placeholder="Pickup location..." />
      </div>
      <div class="location-input-box">
        <span>📍</span>
        <input type="text" id="dropoff-input" placeholder="Where to in Mombasa? (e.g. Nyali Centre)" />
      </div>
    </div>

    <div class="quick-destinations">
      <div class="chip" onclick="setDestination('Nyali Centre', -4.0435, 39.7131)">Nyali Centre</div>
      <div class="chip" onclick="setDestination('SGR Miritini', -3.9961, 39.6056)">SGR Miritini</div>
      <div class="chip" onclick="setDestination('Likoni Ferry', -4.0792, 39.6656)">Likoni Ferry</div>
      <div class="chip" onclick="setDestination('Bamburi', -3.9845, 39.7321)">Bamburi</div>
      <div class="chip" onclick="setDestination('Mombasa CBD', -4.0434, 39.6682)">Mombasa CBD</div>
    </div>

    <button class="book-btn" onclick="requestRide()">REQUEST RIDE (KES 550)</button>
  </div>

  <div class="status-modal" id="status-modal">
    <div class="status-card">
      <h3 id="modal-title">Finding Your Driver...</h3>
      <p id="modal-subtitle">Broadcasting request to nearby Mombasa drivers</p>

      <div class="driver-assigned-box" id="driver-details" style="display: none;">
        <div><strong>Driver:</strong> <span id="assigned-name">Benard</span></div>
        <div><strong>Phone:</strong> <span id="assigned-phone">+254 700 000 000</span></div>
        <div><strong>Vehicle:</strong> <span id="assigned-car">Toyota Fielder</span></div>
        <div class="plate-line">Plate: <span id="assigned-plate">KDS 396K</span></div>
        <div><strong>Docs:</strong> <span id="assigned-doc">Verified</span></div>
      </div>

      <button class="cancel-btn" onclick="cancelSearch()">Cancel Request</button>
    </div>
  </div>

  <script>
    const RIDER_KEY = 'mombasa_ride_rider_v1';
    try {
      const savedRider = JSON.parse(localStorage.getItem(RIDER_KEY) || '{}');
      if (savedRider.name) document.getElementById('rider-name').value = savedRider.name;
      if (savedRider.phone) document.getElementById('rider-phone').value = savedRider.phone;
    } catch {}

    const mombasaCenter = [-4.0435, 39.6682];
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView(mombasaCenter, 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      className: 'dark-map-tiles'
    }).addTo(map);

    function setDestination(name, lat, lng) {
      document.getElementById('dropoff-input').value = name;
      map.flyTo([lat, lng], 14);
    }

    const SERVER_URL = "https://mombasa-ride-server.onrender.com";
    const socket = io(SERVER_URL, {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000
    });

    const connLabel = document.getElementById('conn-label');
    socket.on('connect', () => {
      connLabel.textContent = '🟢 Live Dispatch Ready';
      connLabel.style.color = '#10b981';
    });

    socket.on('disconnect', () => {
      connLabel.textContent = '🔴 Reconnecting...';
      connLabel.style.color = '#ef4444';
    });

    let currentRideId = null;

    function requestRide() {
      const riderName = document.getElementById('rider-name').value.trim();
      const riderPhone = document.getElementById('rider-phone').value.trim();
      const pickup = document.getElementById('pickup-input').value.trim();
      const dropoff = document.getElementById('dropoff-input').value.trim();

      if (!dropoff) {
        alert('Please enter a destination.');
        return;
      }

      localStorage.setItem(RIDER_KEY, JSON.stringify({ name: riderName, phone: riderPhone }));

      if (!socket.connected) {
        alert('Connecting to server... please wait a moment and tap Request Ride again.');
        socket.connect();
        return;
      }

      currentRideId = 'ride_' + Date.now();
      document.getElementById('status-modal').classList.add('active');
      document.getElementById('modal-title').textContent = 'Finding Your Driver...';
      document.getElementById('modal-subtitle').textContent = 'Broadcasting to nearby drivers in Mombasa';
      document.getElementById('driver-details').style.display = 'none';

      socket.emit('new_ride_request', {
        rideId: currentRideId,
        passengerName: riderName || 'Guest Rider',
        passengerPhone: riderPhone || 'Not provided',
        pickup: pickup || 'Mombasa CBD',
        dropoff: dropoff,
        fare: 550
      });
    }

    socket.on('ride_accepted', (data) => {
      if (data.rideId === currentRideId) {
        document.getElementById('modal-title').textContent = 'Driver Assigned! 🎉';
        document.getElementById('modal-subtitle').textContent = 'Your driver is heading to your pickup location.';
        document.getElementById('assigned-name').textContent = data.driverName || 'Benard';
        document.getElementById('assigned-phone').textContent = data.driverPhone || 'Not provided';
        document.getElementById('assigned-car').textContent = data.carModel || 'Vehicle';
        document.getElementById('assigned-plate').textContent = data.plate || 'KDS 396K';
        document.getElementById('assigned-doc').textContent = data.docRef || 'Verified';
        document.getElementById('driver-details').style.display = 'flex';
      }
    });

    function cancelSearch() {
      document.getElementById('status-modal').classList.remove('active');
      currentRideId = null;
    }
  </script>
</body>
</html>
