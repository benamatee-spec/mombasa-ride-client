<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mombasa Rider App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: #111827; border-bottom: 1px solid #1f2937;
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 1000;
    }
    .brand { font-size: 15px; font-weight: 900; color: #34d399; letter-spacing: 0.02em; }
    .conn-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; }
    .dot.ok { background: #10b981; }

    #map { flex: 1; width: 100%; background: #0f172a; z-index: 1; }

    /* Trip Status Banner */
    #trip-banner {
      display: none; position: fixed; top: 54px; left: 12px; right: 12px; z-index: 9500;
      background: #111827; border: 1.5px solid #10b981; border-radius: 14px;
      padding: 12px 14px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
    }
    .tb-stage { font-size: 11px; font-weight: 800; color: #34d399; text-transform: uppercase; letter-spacing: 0.04em; }
    .tb-title { font-size: 14px; font-weight: 800; color: #ffffff; margin-top: 3px; }
    .tb-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; line-height: 1.4; }
    .tb-meter { font-size: 12px; font-weight: 800; color: #38bdf8; margin-top: 5px; }
    .tb-wait { display: none; font-size: 12px; font-weight: 700; color: #fbbf24; margin-top: 5px; }
    .tb-actions { display: flex; gap: 8px; margin-top: 10px; }
    .tb-cancel {
      background: #ef4444; color: #fff; border: none; border-radius: 8px;
      padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
    }

    /* Bottom Sheet */
    .sheet {
      background: #111827; border-top: 1px solid #1f2937; border-radius: 18px 18px 0 0;
      padding: 12px 14px 18px; max-height: 66vh; overflow-y: auto; z-index: 1000;
    }
    .handle { width: 38px; height: 4px; background: #334155; border-radius: 999px; margin: 0 auto 10px; }
    .gps-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
    .gps-text { color: #94a3b8; font-weight: 600; }
    .gps-btn { background: none; border: none; color: #34d399; font-weight: 700; font-size: 12px; cursor: pointer; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 700; }
    .field input, .field select {
      width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155;
      border-radius: 9px; padding: 8px 10px; font-size: 13px;
    }

    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
    .cat-btn {
      background: #182234; color: #f8fafc; border: 1px solid #24324a;
      border-radius: 10px; padding: 9px 8px; text-align: left; cursor: pointer;
    }
    .cat-btn.active { background: #102a24; border: 1.5px solid #10b981; }
    .cat-name { font-size: 12px; font-weight: 800; }
    .cat-min { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .cat-btn.active .cat-min { color: #34d399; font-weight: 700; }

    .estimate-card {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 10px;
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 8px;
    }
    .est-cat { font-size: 13px; font-weight: 800; }
    .est-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .est-price { font-size: 16px; font-weight: 900; color: #10b981; white-space: nowrap; }

    .book-btn {
      width: 100%; background: #10b981; color: #052e16; border: none; border-radius: 12px;
      padding: 13px; font-size: 15px; font-weight: 900; cursor: pointer;
    }
    .book-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint-line { margin-top: 8px; font-size: 12px; color: #94a3b8; min-height: 16px; }

    /* Invoice Modal */
    #invoice-modal {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: rgba(2, 6, 23, 0.88); align-items: center; justify-content: center; padding: 16px;
    }
    .inv-card {
      width: 100%; max-width: 390px; background: #111827; border: 1px solid #334155;
      border-radius: 16px; padding: 16px;
    }
    .inv-title { font-size: 16px; font-weight: 800; color: #34d399; margin-bottom: 10px; }
    .inv-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #1f2937; font-size: 13px; }
    .inv-total { display: flex; justify-content: space-between; padding-top: 10px; font-size: 16px; font-weight: 800; color: #10b981; }
    .inv-close {
      margin-top: 14px; width: 100%; background: #10b981; color: #052e16;
      border: none; border-radius: 10px; padding: 11px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Mombasa Ride</div>
    <div class="conn-pill">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">Connecting...</span>
    </div>
  </header>

  <div id="trip-banner">
    <div class="tb-stage" id="tb-stage">Ride Status</div>
    <div class="tb-title" id="tb-title">Searching for driver...</div>
    <div class="tb-sub" id="tb-sub"></div>
    <div class="tb-meter" id="tb-meter"></div>
    <div class="tb-wait" id="tb-wait">Driver waiting: <span id="tb-wait-clock">00:00</span></div>
    <div class="tb-actions" id="tb-actions" style="display:none;">
      <button type="button" class="tb-cancel" onclick="cancelRideRequest()">Cancel Ride</button>
    </div>
  </div>

  <div id="map"></div>

  <section class="sheet">
    <div class="handle"></div>

    <div class="gps-row">
      <span class="gps-text" id="gps-label">Mombasa GPS ready</span>
      <button type="button" class="gps-btn" onclick="locateRider()">Reposition GPS</button>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="rider-name">Rider Name</label>
        <input type="text" id="rider-name" value="Guest Rider" />
      </div>
      <div class="field">
        <label for="rider-phone">Phone (Optional)</label>
        <input type="text" id="rider-phone" placeholder="+2547..." />
      </div>
      <div class="field">
        <label for="pickup-point">Pickup</label>
        <select id="pickup-point" onchange="updateFareEstimate()">
          <option value="Current Mombasa Location">Current Mombasa Location</option>
          <option value="Nyali Bridge">Nyali Bridge</option>
          <option value="Moi International Airport (MBA)">Moi International Airport (MBA)</option>
          <option value="SGR Miritini">SGR Miritini</option>
          <option value="Likoni Ferry">Likoni Ferry</option>
          <option value="Mombasa CBD">Mombasa CBD</option>
        </select>
      </div>
      <div class="field">
        <label for="dropoff-point">Drop-off</label>
        <select id="dropoff-point" onchange="updateFareEstimate()">
          <option value="Mombasa CBD">Mombasa CBD</option>
          <option value="Nyali Bridge">Nyali Bridge</option>
          <option value="Moi International Airport (MBA)">Moi International Airport (MBA)</option>
          <option value="SGR Miritini">SGR Miritini</option>
          <option value="Likoni Ferry">Likoni Ferry</option>
          <option value="Bamburi / Shanzu">Bamburi / Shanzu</option>
        </select>
      </div>
    </div>

    <div class="cat-grid">
      <button type="button" class="cat-btn" data-cat="Boda" onclick="pickCategory('Boda')">
        <div class="cat-name">Boda</div>
        <div class="cat-min">Min KES 150</div>
      </button>
      <button type="button" class="cat-btn" data-cat="Tukutuku" onclick="pickCategory('Tukutuku')">
        <div class="cat-name">Tukutuku</div>
        <div class="cat-min">Min KES 200</div>
      </button>
      <button type="button" class="cat-btn active" data-cat="Standard" onclick="pickCategory('Standard')">
        <div class="cat-name">Standard</div>
        <div class="cat-min">Min KES 250</div>
      </button>
      <button type="button" class="cat-btn" data-cat="Comfort" onclick="pickCategory('Comfort')">
        <div class="cat-name">Comfort</div>
        <div class="cat-min">Min KES 350</div>
      </button>
      <button type="button" class="cat-btn" data-cat="XL" onclick="pickCategory('XL')">
        <div class="cat-name">XL</div>
        <div class="cat-min">Min KES 400</div>
      </button>
      <button type="button" class="cat-btn" data-cat="VIP Class" onclick="pickCategory('VIP Class')">
        <div class="cat-name">VIP Class</div>
        <div class="cat-min">NEW</div>
      </button>
    </div>

    <div class="estimate-card">
      <div>
        <div class="est-cat" id="est-cat">Standard</div>
        <div class="est-meta" id="est-meta">~2.5 km • Mombasa standard fare</div>
      </div>
      <div class="est-price" id="est-price">KES 250</div>
    </div>

    <button type="button" class="book-btn" id="btn-book-ride" onclick="sendRideRequest()">
      Request Ride
    </button>
    <div class="hint-line" id="hint-line"></div>
  </section>

  <div id="invoice-modal">
    <div class="inv-card">
      <div class="inv-title">Trip Completed • Receipt</div>
      <div id="inv-lines"></div>
      <button type="button" class="inv-close" onclick="closeInvoice()">Done</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const SERVER_URL = 'https://mombasa-ride-server.onrender.com';
    const MOMBASA_DEFAULT = { lat: -4.0435, lng: 39.6682 };

    const TARIFFS = {
      'Boda': { baseFare: 60, perKm: 25, minFare: 150 },
      'Tukutuku': { baseFare: 80, perKm: 35, minFare: 200 },
      'Standard': { baseFare: 120, perKm: 45, minFare: 250 },
      'Comfort': { baseFare: 170, perKm: 60, minFare: 350 },
      'XL': { baseFare: 220, perKm: 75, minFare: 400 },
      'VIP Class': { baseFare: 300, perKm: 95, minFare: 500 }
    };

    const HUB_ZONES = {
      'Nyali Bridge': { km: 3.4, surge: 1.4, note: 'Nyali Bridge 1.4x surge' },
      'Moi International Airport (MBA)': { km: 9.5, surge: 1.3, note: 'MBA Airport 1.3x surge' },
      'SGR Miritini': { km: 14.0, surge: 1.5, note: 'SGR Miritini 1.5x surge' },
      'Likoni Ferry': { km: 5.2, surge: 1.2, note: 'Likoni Ferry 1.2x surge' },
      'Mombasa CBD': { km: 2.2, surge: 1.0, note: 'Mombasa CBD standard fare' },
      'Bamburi / Shanzu': { km: 11.5, surge: 1.2, note: 'North Coast 1.2x surge' }
    };

    let selectedCategory = 'Standard';
    let riderCoords = { ...MOMBASA_DEFAULT };
    let activeRideId = null;
    let quoteFare = 250;
    let quoteSurge = 1.0;
    let riderMarker = null;
    let driverMarker = null;
    let waitTimer = null;
    let waitSeconds = 0;

    let map = null;
    try {
      if (typeof L !== 'undefined') {
        map = L.map('map', { zoomControl: true }).setView([riderCoords.lat, riderCoords.lng], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        riderMarker = L.circleMarker([riderCoords.lat, riderCoords.lng], {
          radius: 8, fillColor: '#38bdf8', color: '#ffffff', weight: 2, fillOpacity: 1
        }).addTo(map);
      }
    } catch (e) {}

    function locateRider() {
      if (map) map.setView([riderCoords.lat, riderCoords.lng], 14);
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          riderCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (riderMarker) riderMarker.setLatLng([riderCoords.lat, riderCoords.lng]);
          if (map) map.setView([riderCoords.lat, riderCoords.lng], 14);
          document.getElementById('gps-label').textContent = 'GPS locked in Mombasa';
        },
        () => {
          document.getElementById('gps-label').textContent = 'Mombasa default location active';
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function pickCategory(cat) {
      if (!TARIFFS[cat]) return;
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      updateFareEstimate();
    }

    function updateFareEstimate() {
      const pickup = document.getElementById('pickup-point').value;
      const dropoff = document.getElementById('dropoff-point').value;
      const zone = HUB_ZONES[dropoff] || HUB_ZONES[pickup] || { km: 2.5, surge: 1.0, note: 'Mombasa standard fare' };
      const tariff = TARIFFS[selectedCategory];

      const raw = Math.round((tariff.baseFare + zone.km * tariff.perKm) * zone.surge);
      quoteFare = Math.max(tariff.minFare, raw);
      quoteSurge = zone.surge;

      document.getElementById('est-cat').textContent = selectedCategory;
      document.getElementById('est-meta').textContent = `~${zone.km.toFixed(1)} km • ${zone.note}`;
      document.getElementById('est-price').textContent = `KES ${quoteFare.toLocaleString()}`;
    }

    function formatClock(sec) {
      const s = Math.max(0, Number(sec) || 0);
      const mins = String(Math.floor(s / 60)).padStart(2, '0');
      const rem = String(s % 60).padStart(2, '0');
      return `${mins}:${rem}`;
    }

    function showBanner(stage, title, sub = '', meter = '', canCancel = false) {
      const banner = document.getElementById('trip-banner');
      if (!banner) return;
      banner.style.display = 'block';
      document.getElementById('tb-stage').textContent = stage;
      document.getElementById('tb-title').textContent = title;
      document.getElementById('tb-sub').textContent = sub;
      document.getElementById('tb-meter').textContent = meter;
      document.getElementById('tb-actions').style.display = canCancel ? 'flex' : 'none';
    }

    function startWaitCounter() {
      stopWaitCounter();
      waitSeconds = 0;
      const box = document.getElementById('tb-wait');
      const clock = document.getElementById('tb-wait-clock');
      if (box) box.style.display = 'block';
      if (clock) clock.textContent = '00:00';
      waitTimer = setInterval(() => {
        waitSeconds += 1;
        if (clock) clock.textContent = formatClock(waitSeconds);
      }, 1000);
    }

    function stopWaitCounter() {
      if (waitTimer) {
        clearInterval(waitTimer);
        waitTimer = null;
      }
      const box = document.getElementById('tb-wait');
      if (box) box.style.display = 'none';
    }

    function updateDriverMarker(lat, lng, label) {
      if (!map || typeof L === 'undefined') return;
      if (typeof lat !== 'number' || typeof lng !== 'number') return;
      if (!driverMarker) {
        driverMarker = L.circleMarker([lat, lng], {
          radius: 10, fillColor: '#10b981', color: '#ffffff', weight: 2, fillOpacity: 1
        }).addTo(map);
      } else {
        driverMarker.setLatLng([lat, lng]);
      }
      if (label) driverMarker.bindTooltip(label);
    }

    function matchesActiveTrip(payload) {
      if (!activeRideId || !payload || !payload.rideId) return true;
      return payload.rideId === activeRideId;
    }

    const socket = typeof io !== 'undefined'
      ? io(SERVER_URL, { transports: ['websocket', 'polling'] })
      : null;

    if (socket) {
      socket.on('connect', () => {
        document.getElementById('conn-dot').classList.add('ok');
        document.getElementById('conn-label').textContent = 'Connected';
      });

      socket.on('disconnect', () => {
        document.getElementById('conn-dot').classList.remove('ok');
        document.getElementById('conn-label').textContent = 'Reconnecting...';
      });

      socket.on('ride_accepted', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        if (data.rideId) activeRideId = data.rideId;

        const driverName = data.driverName || 'Your Driver';
        const plate = data.plate || '';
        const vehicle = data.carModel || data.vehicleClass || selectedCategory;

        document.getElementById('hint-line').textContent = `Ride accepted by ${driverName}`;
        showBanner(
          'Ride Accepted',
          `Ride accepted by ${driverName}`,
          `${vehicle}${plate ? ` • Plate: ${plate}` : ''}${data.driverPhone ? ` • ${data.driverPhone}` : ''}`,
          '',
          true
        );

        if (typeof data.lat === 'number' && typeof data.lng === 'number') {
          updateDriverMarker(data.lat, data.lng, `${driverName} (${plate})`);
        }
      });

      socket.on('driver_location_update', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        const lat = typeof data.lat === 'number' ? data.lat : (data.coords && data.coords.lat);
        const lng = typeof data.lng === 'number' ? data.lng : (data.coords && data.coords.lng);

        if (typeof lat === 'number' && typeof lng === 'number') {
          updateDriverMarker(lat, lng, `${data.driverName || 'Driver'} (${data.plate || ''})`);
        }

        if (data.stage === 'going_to_pickup') {
          showBanner(
            'Driver En Route',
            `${data.driverName || 'Your driver'} is moving to pickup`,
            `${data.vehicleClass || selectedCategory}${data.plate ? ` • ${data.plate}` : ''}`,
            '',
            true
          );
        } else if (data.stage === 'in_progress') {
          const meterText = typeof data.runningFare === 'number'
            ? `Live Meter: KES ${data.runningFare.toLocaleString()}${typeof data.distanceKm === 'number' ? ` • ${data.distanceKm.toFixed(2)} km` : ''}`
            : '';
          showBanner(
            'Trip In Progress',
            `Heading to destination with ${data.driverName || 'your driver'}`,
            `${data.vehicleClass || selectedCategory}${data.plate ? ` • ${data.plate}` : ''}`,
            meterText,
            false
          );
        }
      });

      socket.on('driver_arrived', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        startWaitCounter();
        document.getElementById('hint-line').textContent = data.message || 'Your driver arrived!';
        showBanner(
          'Driver Arrived',
          data.message || 'Your driver arrived!',
          `${data.driverName || 'Driver'}${data.plate ? ` • Plate: ${data.plate}` : ''} is waiting at pickup`,
          '',
          true
        );
      });

      socket.on('trip_started', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        stopWaitCounter();
        document.getElementById('hint-line').textContent = data.message || 'Trip has started!';
        showBanner(
          'Trip Started',
          data.message || 'Trip has started!',
          `Enjoy your ride with ${data.driverName || 'your driver'}`,
          '',
          false
        );
      });

      socket.on('trip_completed', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        stopWaitCounter();
        activeRideId = null;
        document.getElementById('btn-book-ride').disabled = false;
        document.getElementById('hint-line').textContent = 'Trip completed.';

        const inv = data.invoice || {};
        const total = Number(data.totalAmount ?? inv.totalAmount ?? quoteFare);

        showBanner(
          'Trip Completed',
          `Trip ended • Total: KES ${total.toLocaleString()}`,
          `${data.pickup || 'Pickup'} → ${data.dropoff || 'Drop-off'}`,
          '',
          false
        );

        document.getElementById('inv-lines').innerHTML =
          `<div class="inv-row"><span>Driver</span><strong>${data.driverName || 'Driver'} (${data.plate || ''})</strong></div>` +
          `<div class="inv-row"><span>Category</span><span>${inv.category || data.carModel || selectedCategory}</span></div>` +
          `<div class="inv-row"><span>Base Fare</span><span>KES ${inv.baseFare ?? 0}</span></div>` +
          `<div class="inv-row"><span>Distance (${(inv.distanceKm ?? 0).toFixed(2)} km)</span><span>KES ${inv.distanceCharge ?? 0}</span></div>` +
          `<div class="inv-row"><span>Trip Time (${formatClock(inv.tripSeconds)})</span><span>KES ${inv.timeCharge ?? 0}</span></div>` +
          `<div class="inv-row"><span>Waiting (${formatClock(inv.waitSeconds)})</span><span>KES ${inv.waitCharge ?? 0}</span></div>` +
          (inv.surgeMultiplier > 1 ? `<div class="inv-row"><span>Surge</span><span>${inv.surgeMultiplier}x</span></div>` : '') +
          `<div class="inv-total"><span>Total Amount</span><span>KES ${total.toLocaleString()}</span></div>`;

        document.getElementById('invoice-modal').style.display = 'flex';
      });

      socket.on('ride_cancelled_by_driver', (data = {}) => {
        if (!matchesActiveTrip(data)) return;
        stopWaitCounter();
        activeRideId = null;
        document.getElementById('btn-book-ride').disabled = false;
        document.getElementById('hint-line').textContent = 'Ride request cancelled.';
        showBanner('Ride Cancelled', data.reason || 'Driver cancelled the trip.', 'Tap Request Ride whenever you are ready.');
      });
    }

    function sendRideRequest() {
      const passengerName = document.getElementById('rider-name').value.trim() || 'Guest Rider';
      const passengerPhone = document.getElementById('rider-phone').value.trim();
      const pickup = document.getElementById('pickup-point').value;
      const dropoff = document.getElementById('dropoff-point').value;

      activeRideId = `RIDE-${Date.now()}`;
      document.getElementById('btn-book-ride').disabled = true;
      document.getElementById('hint-line').textContent = `Sending ${selectedCategory} request...`;

      showBanner(
        'Request Sent',
        `Searching for ${selectedCategory} driver...`,
        `${pickup} → ${dropoff} • Est. KES ${quoteFare.toLocaleString()}`,
        '',
        true
      );

      if (socket && socket.connected) {
        socket.emit('request_ride', {
          rideId: activeRideId,
          passengerName,
          passengerPhone,
          vehicleClass: selectedCategory,
          pickup,
          dropoff,
          fare: quoteFare,
          surgeMultiplier: quoteSurge,
          coords: riderCoords,
          lat: riderCoords.lat,
          lng: riderCoords.lng
        });
      } else {
        document.getElementById('hint-line').textContent = 'Waiting for Render server connection...';
      }
    }

    function cancelRideRequest() {
      if (socket && socket.connected && activeRideId) {
        socket.emit('ride_cancelled_by_client', {
          rideId: activeRideId,
          message: 'Rider cancelled the trip.'
        });
      }
      stopWaitCounter();
      activeRideId = null;
      document.getElementById('btn-book-ride').disabled = false;
      document.getElementById('tb-actions').style.display = 'none';
      document.getElementById('hint-line').textContent = 'Ride request cancelled.';
      showBanner('Request Cancelled', 'You cancelled the ride request.', 'Select a category and tap Request Ride anytime.');
    }

    function closeInvoice() {
      document.getElementById('invoice-modal').style.display = 'none';
    }

    updateFareEstimate();
    locateRider();
  </script>
</body>
</html>
